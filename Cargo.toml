[package]
name = "openflows-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpenFlows CLI — self-contained terminal CLI to onboard a tenant to a deployed OpenFlows instance (auth: Coder session token)"

# This crate is its own workspace root (it lives inside a directory that has an
# unrelated parent Cargo workspace we must not inherit).
[workspace]

[[bin]]
name = "openflows-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
dialoguer = "0.11"
